<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 460 210" width="460" height="210">
<title>碗 prop — 漆碗（comfort → turning 的 match cut 物件）</title>
<desc>
  越國漆木碗：外黑漆、內朱漆、金口沿。
  bowl-full  = 盛著湯，comfort 場勾踐手上拿的（放在 gj-seated-relaxed 手心 (144,218)）
  bowl-empty = 空碗，turning 場放在地上的同一個碗
  兩者外形完全相同 —— match cut 靠的就是這個，只有內容物變了。
  symbol viewBox 皆 0 0 60 42；碗口 y=10，碗底 y=38。
</desc>

<defs>
  <!-- 碗身共用外形 -->
  <g id="bowl-shell">
    <path d="M6,11 Q9,31 22,36 L38,36 Q51,31 54,11 Z" fill="#2a2320"/>
    <path d="M6,11 Q8,24 15,31 L20,29 Q13,22 11,11 Z" fill="#3a312c"/>
    <g stroke="#c9982a" stroke-width="1.3" opacity=".75" fill="none">
      <path d="M11,19 h6 M20,21 h6 M29,22 h6 M38,21 h6"/>
    </g>
    <rect x="21" y="34" width="18" height="5" rx="1.6" fill="#1a1512"/>
  </g>
  <g id="bowl-rim">
    <ellipse cx="30" cy="11" rx="24" ry="6.5" fill="#8a2f2f"/>
    <ellipse cx="30" cy="12.4" rx="19.5" ry="4.8" fill="#6b2222"/>
    <ellipse cx="30" cy="11" rx="24" ry="6.5" fill="none" stroke="#c9982a" stroke-width="1.5"/>
  </g>

  <!-- 盛湯：comfort -->
  <symbol id="bowl-full" viewBox="0 0 60 42">
    <use xlink:href="#bowl-shell" href="#bowl-shell"/>
    <use xlink:href="#bowl-rim" href="#bowl-rim"/>
    <ellipse cx="30" cy="12.2" rx="19" ry="4.6" fill="#5a4520"/>
    <ellipse cx="25" cy="11.2" rx="5.5" ry="1.7" fill="#7d6434" opacity=".8"/>
    <ellipse cx="37" cy="13" rx="3" ry="1" fill="#7d6434" opacity=".5"/>
  </symbol>

  <!-- 空碗：turning，被放在地上 -->
  <symbol id="bowl-empty" viewBox="0 0 60 42">
    <use xlink:href="#bowl-shell" href="#bowl-shell"/>
    <use xlink:href="#bowl-rim" href="#bowl-rim"/>
  </symbol>
</defs>

<rect width="460" height="210" fill="#0e1a1c"/>
<g fill="#c9982a" font-family="'Noto Serif TC',serif" font-size="17" text-anchor="middle">
  <text x="110" y="166">盛湯・comfort 手上</text>
  <text x="330" y="166">空碗・turning 地上</text>
</g>
<g fill="#4a6b62" font-family="monospace" font-size="12" text-anchor="middle">
  <text x="110" y="188">#bowl-full</text>
  <text x="330" y="188">#bowl-empty</text>
</g>
<use xlink:href="#bowl-full"  href="#bowl-full"  x="20"  y="20" width="180" height="126"/>
<use xlink:href="#bowl-empty" href="#bowl-empty" x="240" y="20" width="180" height="126"/>
</svg>
