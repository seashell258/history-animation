<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 820 260" width="820" height="260">
<title>榻 scene element — 漆木榻與屏靠</title>
<desc>
  越宮漆木榻：竹蓆面、黑漆榻身、朱漆線、壺門牙板。comfort／turning／decision 三場共用。
  couch        viewBox 0 0 620 170 —— 【榻面 y=40】，地面 y=160
  couch-screen viewBox 0 0 150 200 —— 屏靠，放榻的右端

  ⚠ 對位:gj-seated-relaxed 的榻面在該 symbol 的 y=286。
     角色放在 (cx,cy) 且 height=340 時，榻要放在 cy+246 才會貼合
     （因為 cy+286 = by+40 → by = cy+246）。
</desc>

<defs>
  <symbol id="couch" viewBox="0 0 620 170">
    <!-- 竹蓆面（榻面 y=40） -->
    <rect x="14" y="28" width="592" height="16" rx="3" fill="#8a6a3a"/>
    <g stroke="#6d5228" stroke-width="1.4" opacity=".8">
      <path d="M40,28 v16 M76,28 v16 M112,28 v16 M148,28 v16 M184,28 v16 M220,28 v16
               M256,28 v16 M292,28 v16 M328,28 v16 M364,28 v16 M400,28 v16 M436,28 v16
               M472,28 v16 M508,28 v16 M544,28 v16 M580,28 v16"/>
      <path d="M14,36 H606"/>
    </g>
    <path d="M14,28 H606" stroke="#a8834a" stroke-width="2.5"/>
    <!-- 榻身 -->
    <rect x="20" y="44" width="580" height="34" fill="#3a2810"/>
    <rect x="20" y="44" width="580" height="6" fill="#5a3a16"/>
    <rect x="20" y="70" width="580" height="4" fill="#8a2f2f"/>
    <!-- 牙板 -->
    <rect x="28" y="78" width="564" height="18" fill="#4a3218"/>
    <!-- 壺門拱（春秋漆榻的典型腰形開光） -->
    <path d="M86,96 Q98,126 132,132 L488,132 Q522,126 534,96 Z" fill="#2e2010"/>
    <!-- 榻足 -->
    <path d="M38,96 L86,96 L82,158 L42,158 Z" fill="#33240f"/>
    <path d="M534,96 L582,96 L578,158 L538,158 Z" fill="#33240f"/>
    <path d="M38,96 L86,96 L85,104 L39,104 Z" fill="#4a3218"/>
    <path d="M534,96 L582,96 L581,104 L535,104 Z" fill="#4a3218"/>
    <g stroke="#8a2f2f" stroke-width="2.5">
      <path d="M44,140 H80"/><path d="M540,140 H576"/>
    </g>
  </symbol>

  <symbol id="couch-screen" viewBox="0 0 150 200">
    <rect x="10" y="8" width="130" height="168" rx="4" fill="#3a2810"/>
    <rect x="20" y="18" width="110" height="148" rx="2" fill="#2a1c0c"/>
    <rect x="20" y="18" width="110" height="148" rx="2" fill="none"
          stroke="#8a2f2f" stroke-width="3"/>
    <!-- 雲雷紋 -->
    <g fill="none" stroke="#8a6a3a" stroke-width="2.6" opacity=".85">
      <path d="M40,52 h30 v18 h-18 v-9"/>
      <path d="M110,52 h-30 v18 h18 v-9"/>
      <path d="M40,112 h30 v18 h-18 v-9"/>
      <path d="M110,112 h-30 v18 h18 v-9"/>
      <path d="M60,88 h30"/>
    </g>
    <rect x="4" y="176" width="142" height="14" rx="3" fill="#4a3218"/>
    <path d="M18,190 L46,190 L44,200 L20,200 Z" fill="#33240f"/>
    <path d="M104,190 L132,190 L130,200 L106,200 Z" fill="#33240f"/>
  </symbol>
</defs>

<rect width="820" height="260" fill="#0e1a1c"/>
<g fill="#c9982a" font-family="'Noto Serif TC',serif" font-size="17" text-anchor="middle">
  <text x="320" y="218">漆木榻（榻面 y=40）</text>
  <text x="700" y="218">屏靠</text>
</g>
<g fill="#4a6b62" font-family="monospace" font-size="12" text-anchor="middle">
  <text x="320" y="240">#couch</text>
  <text x="700" y="240">#couch-screen</text>
</g>
<path d="M20 200 H800" stroke="#22403c" stroke-width="1.5"/>
<use xlink:href="#couch"        href="#couch"        x="10"  y="30" width="620" height="170"/>
<use xlink:href="#couch-screen" href="#couch-screen" x="640" y="0"  width="150" height="200"/>
</svg>
