<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 560 340" width="560" height="340">
<title>燈 scene element — 青銅豆形油燈</title>
<desc>
  ⚠ 與 v1 不同:v1 用的是懸掛紙燈籠，但紙燈籠要到漢以後才有，春秋時期是青銅豆形油燈。
     教學用途優先歷史正確性。若要改回燈籠請告知。

  lamp-stand viewBox 0 0 120 260 —— 燈座本體，地面 y=252，燈盤面 y=118
  lamp-flame viewBox 0 0 60 96  —— 火焰，獨立 symbol 以便場景單獨做動畫
  組合:燈盤中心在 lamp-stand 的 (60,118)，把 lamp-flame 的底部中心對到那裡。
</desc>

<defs>
  <radialGradient id="lamp-glow-grad" cx="50%" cy="62%" r="52%">
    <stop offset="0%" stop-color="#f0c060" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#d4893a" stop-opacity="0"/>
  </radialGradient>

  <symbol id="lamp-stand" viewBox="0 0 120 260">
    <!-- 底盤 -->
    <ellipse cx="60" cy="240" rx="44" ry="13" fill="#4a4434"/>
    <path d="M16,240 Q16,226 60,222 Q104,226 104,240 Z" fill="#6b6250"/>
    <ellipse cx="60" cy="222" rx="44" ry="12" fill="#7d7460"/>
    <ellipse cx="60" cy="222" rx="30" ry="8" fill="#5a5240"/>
    <!-- 柱身 -->
    <path d="M51,222 L51,132 L69,132 L69,222 Z" fill="#6b6250"/>
    <path d="M51,222 L51,132 L57,132 L57,222 Z" fill="#8a7f63"/>
    <path d="M64,132 L69,132 L69,222 L64,222 Z" fill="#403a2c"/>
    <!-- 柱身節（青銅器常見的箍） -->
    <g>
      <ellipse cx="60" cy="196" rx="14" ry="5" fill="#7d7460"/>
      <ellipse cx="60" cy="164" rx="13" ry="4.6" fill="#7d7460"/>
    </g>
    <!-- 銅綠 -->
    <g fill="#4a6b55" opacity=".55">
      <ellipse cx="55" cy="180" rx="4" ry="11"/>
      <ellipse cx="66" cy="208" rx="3" ry="8"/>
      <ellipse cx="34" cy="228" rx="9" ry="4"/>
    </g>
    <!-- 燈盤（豆形），盤面 y=118 -->
    <path d="M18,116 Q20,138 60,142 Q100,138 102,116 Z" fill="#6b6250"/>
    <path d="M18,116 Q20,132 42,138 L48,134 Q28,128 26,116 Z" fill="#8a7f63"/>
    <ellipse cx="60" cy="116" rx="42" ry="11" fill="#5a5240"/>
    <ellipse cx="60" cy="117" rx="34" ry="8" fill="#3d3729"/>
    <!-- 燈油 -->
    <ellipse cx="60" cy="118" rx="30" ry="6.5" fill="#5c4a20"/>
    <!-- 燈芯 -->
    <path d="M57,118 L59,104 L63,104 L62,118 Z" fill="#2e2a20"/>
    <!-- 口沿紋 -->
    <g fill="none" stroke="#403a2c" stroke-width="1.6" opacity=".8">
      <path d="M24,124 h10 M42,128 h10 M62,128 h10 M82,124 h10"/>
    </g>
  </symbol>

  <symbol id="lamp-flame" viewBox="0 0 60 96">
    <ellipse cx="30" cy="60" rx="30" ry="36" fill="url(#lamp-glow-grad)"/>
    <path d="M30,10 Q44,34 44,56 Q44,80 30,88 Q16,80 16,56 Q16,34 30,10 Z" fill="#d4893a"/>
    <path d="M30,24 Q39,42 39,58 Q39,76 30,84 Q21,76 21,58 Q21,42 30,24 Z" fill="#f0c060"/>
    <path d="M30,44 Q35,54 35,64 Q35,76 30,80 Q25,76 25,64 Q25,54 30,44 Z" fill="#fff2c8"/>
  </symbol>
</defs>

<rect width="560" height="340" fill="#0e1a1c"/>
<g fill="#c9982a" font-family="'Noto Serif TC',serif" font-size="17" text-anchor="middle">
  <text x="110" y="296">燈座（盤面 y=118）</text>
  <text x="300" y="296">火焰</text>
  <text x="460" y="296">組合後</text>
</g>
<g fill="#4a6b62" font-family="monospace" font-size="12" text-anchor="middle">
  <text x="110" y="318">#lamp-stand</text>
  <text x="300" y="318">#lamp-flame</text>
  <text x="460" y="318">stand + flame</text>
</g>
<path d="M20 280 H540" stroke="#22403c" stroke-width="1.5"/>
<use xlink:href="#lamp-stand" href="#lamp-stand" x="50"  y="20" width="120" height="260"/>
<use xlink:href="#lamp-flame" href="#lamp-flame" x="270" y="120" width="60" height="96"/>
<g>
  <use xlink:href="#lamp-stand" href="#lamp-stand" x="400" y="20" width="120" height="260"/>
  <use xlink:href="#lamp-flame" href="#lamp-flame" x="430" y="42" width="60" height="96"/>
</g>
</svg>
